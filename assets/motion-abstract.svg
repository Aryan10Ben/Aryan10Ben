<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="Animated data pipeline"><title>Animated data pipeline</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02040a"/><stop offset=".58" stop-color="#080e1c"/><stop offset="1" stop-color="#02040a"/></linearGradient><radialGradient id="a"><stop stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><radialGradient id="b"><stop stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="scan"><stop stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="959" height="199" rx="0" fill="url(#bg)" stroke="#334155" stroke-opacity=".35"/><g stroke="#94a3b8" stroke-opacity=".09" stroke-width=".8"><path d="M160 0V200"/><path d="M320 0V200"/><path d="M480 0V200"/><path d="M640 0V200"/><path d="M800 0V200"/><path d="M0 40H960"/><path d="M0 80H960"/><path d="M0 120H960"/><path d="M0 160H960"/><path d="M0 200H960"/></g><rect x="80" y="79" width="145" height="2" fill="url(#scan)" opacity=".8"><animate attributeName="x" from="-150" to="960" dur="3s" repeatCount="indefinite"/></rect><rect x="580" y="119" width="110" height="2" fill="#f472b6" opacity=".8"><animate attributeName="x" from="-150" to="960" dur="4.5s" repeatCount="indefinite"/></rect><rect x="270" y="159" width="125" height="2" fill="url(#scan)" opacity=".8"><animate attributeName="x" from="960" to="-150" dur="2.8s" repeatCount="indefinite"/></rect><g transform="translate(480 100)"><circle r="60" fill="none" stroke="#94a3b8" stroke-opacity=".35" stroke-dasharray="3 5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></circle><circle r="45" fill="none" stroke="#38bdf8" stroke-opacity=".65" stroke-dasharray="22 9 4 9" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/></circle><circle r="30" fill="none" stroke="#f472b6" stroke-opacity=".5"/><circle r="9" fill="#f8fafc" filter="url(#glow)"><animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/></circle><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/><circle cx="45" r="4" fill="#38bdf8" filter="url(#glow)"/></g><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/><circle cy="60" r="3" fill="#f472b6" filter="url(#glow)"/></g></g><text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" letter-spacing="2">SYS_NODE_AK</text><text x="940" y="30" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="end" letter-spacing="2">RAG / API</text><text x="20" y="180" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" letter-spacing="2">PIPELINE_ACTIVE</text><text x="940" y="180" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="end" letter-spacing="2">INPUT → OUTPUT</text></svg>
