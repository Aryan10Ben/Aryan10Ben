<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="960" height="160" role="img" aria-label="About Aryan Kumar"><title>About Aryan Kumar</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02040a"/><stop offset=".58" stop-color="#080e1c"/><stop offset="1" stop-color="#02040a"/></linearGradient><radialGradient id="a"><stop stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><radialGradient id="b"><stop stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="scan"><stop stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="959" height="159" rx="12" fill="url(#bg)" stroke="#334155" stroke-opacity=".35"/><circle cx="880" cy="80" r="90" fill="url(#b)"><animate attributeName="opacity" values=".3;.8;.3" dur="5s" repeatCount="indefinite"/></circle><text x="40" y="60" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#f8fafc" >Final-year Mechanical Engineering undergraduate at NIT Agartala, Class of 2027.</text><text x="40" y="91" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" >Focused on Python backend development, applied AI and retrieval-augmented generation.</text><text x="40" y="121" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" >I enjoy building practical applications, designing APIs and solving algorithmic problems.</text></svg>
