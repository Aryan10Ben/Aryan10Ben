<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="960" height="160" role="img" aria-label="About Aryan Kumar"><title>About Aryan Kumar</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset=".58" stop-color="#e7eff9"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><radialGradient id="a"><stop stop-color="#238bff" stop-opacity=".35"/><stop offset="1" stop-color="#238bff" stop-opacity="0"/></radialGradient><radialGradient id="b"><stop stop-color="#1267c4" stop-opacity=".28"/><stop offset="1" stop-color="#1267c4" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="scan"><stop stop-color="#1267c4" stop-opacity="0"/><stop offset=".5" stop-color="#1267c4" stop-opacity=".8"/><stop offset="1" stop-color="#1267c4" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="959" height="159" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-opacity=".35"/><circle cx="880" cy="80" r="90" fill="url(#b)"><animate attributeName="opacity" values=".3;.8;.3" dur="5s" repeatCount="indefinite"/></circle><text x="40" y="62" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155">I engineer <tspan fill="#0369a1" font-weight="600">purposeful software</tspan> at the intersection of computation, intelligence, and design.</text><text x="40" y="92" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155">My focus lies in <tspan fill="#0369a1" font-weight="600">backend systems</tspan>, software architecture, algorithmic thinking, and emerging technologies.</text></svg>
